<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrewDesk — لا يوجد اتصال</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a120b;
        color: #f5e9da;
        font-family: "Segoe UI", Tahoma, sans-serif;
        text-align: center;
      }
      .card { max-width: 460px; padding: 32px; }
      .icon {
        width: 72px; height: 72px; margin: 0 auto 20px;
        display: flex; align-items: center; justify-content: center;
        background: #c8841d; border-radius: 18px; font-size: 34px;
      }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { color: #b9a892; line-height: 1.7; margin: 0 0 24px; font-size: 15px; }
      button {
        background: #c8841d; color: #fff; border: none; border-radius: 10px;
        padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #b3741a; }
      .hint { margin-top: 16px; font-size: 13px; color: #7d6f5e; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">☕</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        تعذّر الوصول إلى BrewDesk حالياً. سيُعاد الاتصال تلقائياً فور عودة
        الإنترنت، أو يمكنك المحاولة الآن.
      </p>
      <button onclick="retry()">إعادة المحاولة</button>
      <div class="hint">يتم فحص الاتصال تلقائياً كل بضع ثوانٍ…</div>
    </div>
    <script>
      var APP_URL = "https://ziyad-deskcafe.com";
      function retry() {
        location.href = APP_URL;
      }
      setInterval(function () {
        if (navigator.onLine) location.href = APP_URL;
      }, 4000);
      window.addEventListener("online", function () {
        location.href = APP_URL;
      });
    </script>
  </body>
</html>
