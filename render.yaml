services:
  - type: web
    name: laini-cafe1
    env: node
    buildCommand: "npx pnpm install && npx pnpm --filter @workspace/brewdesk build && npx pnpm --filter api-server build && mkdir -p artifacts/api-server/dist/public artifacts/api-server/public && cp -r artifacts/brewdesk/dist/public/* artifacts/api-server/dist/public/ && cp -r artifacts/brewdesk/dist/public/* artifacts/api-server/public/"
    startCommand: "npx pnpm --filter api-server start"
    envVars:
      - key: PNPM_VERSION
        value: "10.15.1"
      - key: NODE_ENV
        value: "production"
