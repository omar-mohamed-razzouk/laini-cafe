              schema:
                $ref: "#/components/schemas/ReportSummary"

  /reports/transactions:
    get:
      operationId: getTransactionsReport
      tags: [reports]
      summary: Full transactions log with line items and breakdowns for a period
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [daily, weekly, monthly, yearly]
        - name: date
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Transactions report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsReport"

  /reports/staff-performance:
    get:
      operationId: getStaffPerformance
      tags: [reports]
      summary: Get top staff by sales
      responses:
        "200":
          description: Staff performance
          content:
