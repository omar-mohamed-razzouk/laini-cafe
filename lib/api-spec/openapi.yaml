  # ── Inventory ─────────────────────────────────────────────────────────
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List all inventory items
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
