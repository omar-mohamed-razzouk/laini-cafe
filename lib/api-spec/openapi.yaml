          type: integer
        customerName:
          type: string
        discountPercent:
          type: number
          minimum: 0
          maximum: 100
        amountPaid:
          type: number
          minimum: 0
        paymentMethod:
          type: string
          enum: [cash, card, mixed]
        staffId:
          type: integer
        notes:
          type: string
        items:
          type: array
