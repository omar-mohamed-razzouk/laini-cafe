  # ── Dashboard ─────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get live dashboard stats (occupancy, revenue, active sessions)
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Auth ────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResult:
      type: object
      required: [staff, token]
      properties:
        staff:
          $ref: "#/components/schemas/Staff"
        token:
          type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6

    ForceChangePasswordInput:
      type: object
      required: [username, currentPassword, newPassword]
      properties:
        username:
          type: string
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6

    VersionInfo:
      type: object
      required: [version]
      properties:
        version:
          type: string

    MessageResult:
      type: object
      required: [message]
      properties:
        message:
          type: string
        token:
          type: string
          description: Optional refreshed bearer token (e.g. after a password change re-issues the session).

    # ── Admin ───────────────────────────────────────────────────────────
    ResetDataInput:
      type: object
      required: [confirm, scopes]
      properties:
        confirm:
          type: string
          description: Must equal the literal string "RESET"
        scopes:
          $ref: "#/components/schemas/ResetDataScopes"

    ResetDataScopes:
      type: object
      properties:
        ordersSessions:
          type: boolean
        bookings:
          type: boolean
        invoices:
          type: boolean
        expenses:
          type: boolean
        customers:
          type: boolean
        inventory:
          type: boolean

    ResetDataResult:
      type: object
      required: [message, deleted]
      properties:
        message:
          type: string
        deleted:
          type: object
          additionalProperties:
            type: integer

    # ── Staff ───────────────────────────────────────────────────────────
    Staff:
      type: object
      required: [id, name, username, role, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, manager, cashier, waiter, kitchen]
        isActive:
          type: boolean
        phone:
          type: ["string", "null"]
        permissions:
          type: ["object", "null"]
        createdAt:
          type: string

    StaffInput:
      type: object
      required: [name, username, password, role]
      properties:
        name:
          type: string
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, manager, cashier, waiter, kitchen]
        phone:
          type: string
        permissions:
          type: object

    StaffUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [admin, manager, cashier, waiter, kitchen]
        phone:
          type: string
        isActive:
          type: boolean
        permissions:
          type: object
        password:
          type: string

    # ── Tables ──────────────────────────────────────────────────────────
    Table:
      type: object
      required: [id, number, capacity, status, type, posX, posY, hourlyRate]
      properties:
        id:
          type: integer
        number:
          type: integer
        capacity:
          type: integer
        status:
          type: string
          enum: [available, reserved, occupied]
        type:
          type: string
          enum: [regular, football, work]
        hourlyRate:
          type: number
          minimum: 0
        posX:
          type: integer
        posY:
          type: integer
        qrCode:
          type: ["string", "null"]
        minOrderAmount:
          type: ["number", "null"]

    TableInput:
      type: object
      required: [number, capacity, type]
      properties:
        number:
          type: integer
        capacity:
          type: integer
        type:
          type: string
          enum: [regular, football, work]
        hourlyRate:
          type: number
          minimum: 0
        posX:
          type: integer
        posY:
          type: integer
        minOrderAmount:
          type: number

    TableUpdate:
      type: object
      properties:
        number:
          type: integer
        capacity:
          type: integer
        status:
          type: string
          enum: [available, reserved, occupied]
        type:
          type: string
          enum: [regular, football, work]
        hourlyRate:
          type: number
          minimum: 0
        posX:
          type: integer
        posY:
          type: integer
        minOrderAmount:
          type: number

    # ── Rooms ───────────────────────────────────────────────────────────
    Room:
      type: object
      required: [id, name, capacity, type, status, hourlyRate]
      properties:
        id:
          type: integer
        name:
          type: string
        capacity:
          type: integer
        type:
          type: string
          enum: [meeting, lecture, training]
        status:
          type: string
          enum: [available, reserved, occupied]
        hourlyRate:
          type: number
          minimum: 0
        hasProjector:
          type: boolean
        hasMicrophone:
          type: boolean
        hasWhiteboard:
          type: boolean
        qrCode:
          type: ["string", "null"]

    RoomInput:
      type: object
      required: [name, capacity, type, hourlyRate]
      properties:
        name:
          type: string
        capacity:
          type: integer
        type:
          type: string
          enum: [meeting, lecture, training]
        hourlyRate:
          type: number
        hasProjector:
          type: boolean
        hasMicrophone:
          type: boolean
        hasWhiteboard:
          type: boolean

    RoomUpdate:
      type: object
      properties:
        name:
          type: string
        capacity:
          type: integer
        type:
          type: string
          enum: [meeting, lecture, training]
        status:
          type: string
          enum: [available, reserved, occupied]
        hourlyRate:
          type: number
          minimum: 0
        hasProjector:
          type: boolean
        hasMicrophone:
          type: boolean
        hasWhiteboard:
          type: boolean

    # ── Menu ────────────────────────────────────────────────────────────
    Category:
      type: object
      required: [id, name, sortOrder]
      properties:
        id:
          type: integer
        name:
          type: string
        icon:
          type: ["string", "null"]
        sortOrder:
          type: integer

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        icon:
          type: string
        sortOrder:
          type: integer

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
        sortOrder:
          type: integer

    MenuItem:
      type: object
      required: [id, name, price, categoryId, isAvailable]
      properties:
        id:
          type: integer
        name:
          type: string
        nameAr:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        price:
          type: number
        discountPercent:
          type: ["number", "null"]
        finalPrice:
          type: number
        categoryId:
          type: integer
        categoryName:
          type: ["string", "null"]
        isAvailable:
          type: boolean
        preparationTime:
          type: ["integer", "null"]

    MenuItemInput:
      type: object
      required: [name, price, categoryId]
      properties:
        name:
          type: string
        nameAr:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0
        discountPercent:
          type: number
          minimum: 0
          maximum: 100
        categoryId:
          type: integer
        isAvailable:
          type: boolean
        preparationTime:
          type: integer

    MenuItemUpdate:
      type: object
      properties:
        name:
          type: string
        nameAr:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0
        discountPercent:
          type: number
          minimum: 0
          maximum: 100
        categoryId:
          type: integer
        isAvailable:
          type: boolean
        preparationTime:
          type: integer

    PopularItem:
      type: object
      required: [id, name, totalOrdered, revenue]
      properties:
        id:
          type: integer
        name:
          type: string
        totalOrdered:
          type: integer
        revenue:
          type: number

    # ── Bookings ────────────────────────────────────────────────────────
    Booking:
      type: object
      required: [id, type, resourceId, resourceName, customerName, customerPhone, startTime, endTime, status, guestCount, totalAmount, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [table, room, football]
        resourceId:
          type: integer
        resourceName:
          type: string
        customerName:
          type: string
        customerPhone:
          type: ["string", "null"]
        startTime:
          type: string
        endTime:
          type: string
        status:
          type: string
          enum: [pending, confirmed, active, completed, cancelled]
        guestCount:
          type: integer
        totalAmount:
          type: number
        includesDrinks:
          type: ["boolean", "null"]
        needsProjector:
          type: ["boolean", "null"]
        needsMicrophone:
          type: ["boolean", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    BookingInput:
      type: object
      required: [type, resourceId, customerName, startTime, endTime, guestCount]
      properties:
        type:
          type: string
          enum: [table, room, football]
        resourceId:
          type: integer
        customerName:
          type: string
        customerPhone:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        guestCount:
          type: integer
          minimum: 1
        includesDrinks:
          type: boolean
        needsProjector:
          type: boolean
        needsMicrophone:
          type: boolean
        notes:
          type: string

    BookingUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, active, completed, cancelled]
        startTime:
          type: string
        endTime:
          type: string
        guestCount:
          type: integer
          minimum: 1
        includesDrinks:
          type: boolean
        needsProjector:
          type: boolean
        needsMicrophone:
          type: boolean
        notes:
          type: string

    # ── Sessions ────────────────────────────────────────────────────────
    Session:
      type: object
      required: [id, type, resourceId, resourceName, startTime, status, currentCost, staffId]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [table, room, football, work]
        resourceId:
          type: integer
        resourceName:
          type: string
        bookingId:
          type: ["integer", "null"]
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        customerPhone:
          type: ["string", "null"]
        guestCount:
          type: ["integer", "null"]
        startTime:
          type: string
        endTime:
          type: ["string", "null"]
        plannedEndTime:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, extended, closed]
        currentCost:
          type: number
        billingMode:
          type: string
          enum: [flat, per_person]
        perPersonRate:
          type: ["number", "null"]
        timeStoppedAt:
          type: ["string", "null"]
        staffId:
          type: integer
        staffName:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    SessionGuest:
      type: object
      required: [id, sessionId, joinedAt, billedHours, amount]
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        name:
          type: ["string", "null"]
        joinedAt:
          type: string
        leftAt:
          type: ["string", "null"]
        billedHours:
          type: number
        amount:
          type: number

    SessionInput:
      type: object
      required: [type, resourceId, staffId]
      properties:
        type:
          type: string
          enum: [table, room, football, work]
        resourceId:
          type: integer
        bookingId:
          type: integer
        customerId:
          type: integer
        customerName:
          type: string
        customerPhone:
          type: string
        guestCount:
          type: integer
          minimum: 1
        plannedEndTime:
          type: string
        billingMode:
          type: string
          enum: [flat, per_person]
        perPersonRate:
          type: number
          minimum: 0
        guestNames:
          type: array
          items:
            type: string
        staffId:
          type: integer
        notes:
          type: string

    SessionBill:
      type: object
      required: [sessionId, resourceName, startTime, billingMode, items, timeCost, orderCost, total]
      properties:
        sessionId:
          type: integer
        resourceName:
          type: string
        guestCount:
          type: ["integer", "null"]
        startTime:
          type: string
        billingMode:
          type: string
          enum: [flat, per_person]
        timeStoppedAt:
          type: ["string", "null"]
        guests:
          type: array
          items:
            $ref: "#/components/schemas/SessionGuest"
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItem"
        timeCost:
          type: number
        orderCost:
          type: number
        total:
          type: number

    SessionUpdate:
      type: object
      properties:
        plannedEndTime:
          type: string
        status:
          type: string
          enum: [active, extended, closed]
        guestCount:
          type: integer
          minimum: 1
        notes:
          type: string

    # ── Orders ──────────────────────────────────────────────────────────
    OrderItem:
      type: object
      required: [id, menuItemId, menuItemName, quantity, unitPrice, subtotal]
      properties:
        id:
          type: integer
        menuItemId:
          type: integer
        menuItemName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        subtotal:
          type: number
        notes:
          type: ["string", "null"]

    Order:
      type: object
      required: [id, sessionId, status, totalAmount, createdAt, items]
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        staffId:
          type: ["integer", "null"]
        staffName:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, preparing, ready, delivered, cancelled]
        totalAmount:
          type: number
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    OrderItemInput:
      type: object
      required: [menuItemId, quantity]
      properties:
        menuItemId:
          type: integer
        quantity:
          type: integer
          minimum: 1
        notes:
          type: string

    OrderInput:
      type: object
      required: [sessionId, items]
      properties:
        sessionId:
          type: integer
        staffId:
          type: integer
        notes:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"

    OrderUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, preparing, ready, delivered, cancelled]
        notes:
          type: string
        reason:
          type: string

    # ── Invoices ────────────────────────────────────────────────────────
    InvoiceItem:
      type: object
      required: [description, quantity, unitPrice, subtotal]
      properties:
        description:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        subtotal:
          type: number

