      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly, yearly]
        - name: date
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Cancellations report
          content:
